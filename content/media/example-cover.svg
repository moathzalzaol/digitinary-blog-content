<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Digitinary blog example cover</title>
  <desc id="desc">Blue gradient placeholder cover for a draft blog post.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071B3A"/>
      <stop offset="100%" stop-color="#0DACE3"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1330" cy="120" r="320" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="260" cy="820" r="420" fill="#FFFFFF" opacity="0.06"/>
  <text x="120" y="410" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="78" font-weight="700">Digitinary Blog</text>
  <text x="120" y="510" fill="#D8F5FF" font-family="Arial, sans-serif" font-size="42">Example draft cover</text>
</svg>
